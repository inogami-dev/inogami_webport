<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>my_portfolio</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!-- <h1> Hello, World!</h1> -->
   <div id="loading-indicator">
  <!-- Replace 'icon.png' with your actual image path later -->
  <img src="icons/Icon-512.png" alt="App Logo" id="app-logo" />
  <div class="loader"></div>
    <h2 class="loading-text">Initializing Workspace...</h2>
  </div>

  <style>
    body {
      background-color: #f8f9fa;
      margin: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      transition: opacity 0.6s ease-out;
    }
    #app-logo {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      background-color: #e9ecef; /* Placeholder color before image loads */
      margin-bottom: 24px;
      object-fit: cover;
    }
    .loading-text {
      color: #495057;
      font-weight: 300;
      margin-top: 24px;
      letter-spacing: 1px;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid #dee2e6;
      border-top: 3px solid #007bff; /* Primary brand color */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <!-- 3. The Initialization Script -->
  <script>
    // @ts-nocheck
    window.addEventListener('load', function(ev) {
      // Inject Flutter's required configuration variables
      {{flutter_js}}
      {{flutter_build_config}}
      
      // Use the new .load() method instead of the deprecated .loadEntrypoint()
      _flutter.loader.load({
        serviceWorker: {
          // Use the new template token for the service worker version
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            // Start the Flutter app
            return appRunner.runApp();
          }).then(function() {
            // Smoothly fade out the loading screen once the app is running
            let loader = document.querySelector('#loading-indicator');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(() => loader.remove(), 600); // Remove from DOM after fade
            }
          });
        }
      });
    });
  </script>
  <!-- <script src="flutter_bootstrap.js" async></script> -->
</body>
</html>
